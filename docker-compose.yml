services:
  postgres:
    image: postgres:16-alpine
    container_name: sedpayroll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sedpayroll
      POSTGRES_PASSWORD: sedpayroll
      POSTGRES_DB: sedpayroll
    ports:
      - "5432:5432"
    volumes:
      - sedpayroll_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sedpayroll -d sedpayroll"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sedpayroll_pgdata:
    name: sedpayroll_pgdata
